
{% extends "base.html" %}
{% block title %}Administrator Login | BLAZE DESK{% endblock %}

{% block content %}
<section class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-icon">F</span>
      <span>FIRE <strong>LINE</strong></span>
    </div>

    <p class="login-eyebrow">SECURE ACCESS</p>
    <h1>Administrator Login</h1>
    <p class="login-description">
      Sign in to access the incident management and emergency response dashboard.
    </p>

    <form method="post" class="login-form">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        required
        autocomplete="username"
        placeholder="Enter your username"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        required
        autocomplete="current-password"
        placeholder="Enter your password"
      >

      <button class="button login-button" type="submit">
        Sign In to Dashboard
      </button>
    </form>

    <p class="login-security">
      <span>🔒</span> Authorised personnel only
    </p>
  </div>
</section>

<style>
.login-page {
  min-height: 75vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 45px 18px;
}

.login-card {
  width: 100%;
  max-width: 440px;
  padding: 38px;
  background: #151d29;
  border: 1px solid #293548;
  border-radius: 16px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
}

.login-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: #f5f7fa;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 35px;
}

.login-brand strong {
  color: #ff762f;

}

.login-brand-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: #ff762f;
  color: #111827;
  font-size: 23px;
  font-weight: 900;
}

.login-eyebrow {
  color: #ff762f;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 9px;
}

.login-card h1 {
  color: #f5f7fa;
  font-size: 29px;
  margin: 0 0 10px;
}

.login-description {
  color: #aab5c4;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 28px;
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.login-form label {
  color: #e5eaf1;
  font-size: 13px;
  font-weight: 700;
  margin-top: 7px;
}

.login-form input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px 14px;
  border: 1px solid #35445a;
  border-radius: 8px;
  background: #0d1420;
  color: #f5f7fa;
  font-size: 14px;
  outline: none;
}

.login-form input::placeholder {
  color: #718096;
}

.login-form input:focus {
  border-color: #ff762f;
  box-shadow: 0 0 0 3px rgba(255, 118, 47, 0.13);
}

.login-button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #ff762f;
  color: #111827;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}

.login-button:hover {
  background: #ff914f;
  transform: translateY(-1px);
}

.login-security {
  margin: 25px 0 0;
  padding-top: 18px;
  border-top: 1px solid #293548;
  color: #8996a8;
  text-align: center;
  font-size: 12px;
}

@media (max-width: 480px) {
  .login-card {
    padding: 27px 22px;
  }

  .login-card h1 {
    font-size: 25px;
  }
}
</style>
{% endblock %}
